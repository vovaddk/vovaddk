name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#1565C0&color_dots=#ebedf0,#bbdefb,#64b5f6,#1e88e5,#0d47a1
            dist/snake-dark.svg?palette=github-dark&color_snake=#64B5F6&color_dots=#161b22,#0d3a63,#1565c0,#42a5f5,#90caf9

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
